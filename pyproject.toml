[project]
name = "fraud-scoring-engine"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.18.4",
    "kagglehub>=1.0.1",
    "pandas>=2.2.0",
    "psycopg[binary]>=3.3.4",
    "sqlalchemy>=2.0.49",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
dev = [
    "ipykernel>=7.2.0",
    "jupyter>=1.1.1",
    "matplotlib>=3.10.0",
    "pandas-stubs>=2.2.0",
    "pytest>=9.0.3",
    "scipy>=1.15.0",
    "seaborn>=0.13.0",
]

[tool.pyright]
extraPaths = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
