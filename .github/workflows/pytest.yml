name: Run pytest

on:
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install uv
      uses: astral-sh/setup-uv@v5
      with:
        version: "latest" 
        enable-cache: true

    - name: Set up Python
      run: uv python install

    - name: Run Pytest
      run: uv run pytest